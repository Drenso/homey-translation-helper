name: NPM Publish
on:
  push:
    tags:
      - v*

env:
  VERDACCIO_TOKEN: ${{secrets.VERDACCIO_TOKEN}}

jobs:
  publish:
    name: Publish
    permissions:
      actions: write
      contents: write
      id-token: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup NPM
        run: |
          echo '//npm.drenso.dev/:_authToken=${VERDACCIO_TOKEN}' >> .npmrc
      - name: Use Node.js 24.x
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: https://npm.drenso.dev
      - name: Install dependencies
        run: npm ci
      - name: Publish
        run: npm publish --registry=https://registry.npmjs.org --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_AUTH_TOKEN}}
